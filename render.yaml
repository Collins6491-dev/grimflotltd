services:
  - type: web
    name: grimflot-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput --settings=config.settings.production
    preDeployCommand: python manage.py migrate --noinput --settings=config.settings.production
    startCommand: gunicorn config.wsgi:application --workers 3 --access-logfile - --error-logfile - --timeout 60
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: grimflot-postgres
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: MEDIA_STORAGE_PROVIDER
        value: s3
      - key: MEDIA_STORAGE_BUCKET
        sync: false
      - key: MEDIA_STORAGE_ACCESS_KEY
        sync: false
      - key: MEDIA_STORAGE_SECRET_KEY
        sync: false
      - key: MEDIA_STORAGE_ENDPOINT
        sync: false
      - key: MEDIA_STORAGE_REGION
        sync: false
      - key: REDIS_URL
        sync: false
databases:
  - name: grimflot-postgres
    plan: basic-256mb
